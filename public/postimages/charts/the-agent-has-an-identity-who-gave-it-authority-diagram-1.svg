<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 476" font-family="Inter Variable, Inter, system-ui, -apple-system, sans-serif">
<style>
  :root {
    --bg: #ffffff; --card: #f9fafb; --border: #e5e7eb;
    --text: #111827; --subtext: #6b7280; --muted: #9ca3af;
    --c0: #0284c7; --c1: #d97706; --c2: #059669; --c3: #dc2626;
    --c4: #7c3aed; --c5: #db2777; --c6: #0891b2; --c7: #ea580c;
    --on-primary: white; --detail: #bfdbfe; --item-bg: #f0f9ff;
    --s1: #e0f2fe; --s2: #7dd3fc; --s3: #0ea5e9; --s4: #0369a1;
  }
  .dark svg {
    --bg: #030712; --card: #111827; --border: #1f2937;
    --text: #f9fafb; --subtext: #9ca3af; --muted: #6b7280;
    --c0: #38bdf8; --c1: #fbbf24; --c2: #34d399; --c3: #f87171;
    --c4: #a78bfa; --c5: #f472b6; --c6: #22d3ee; --c7: #fb923c;
    --on-primary: white; --detail: #7dd3fc; --item-bg: #0c4a6e;
    --s1: #082f49; --s2: #0c4a6e; --s3: #075985; --s4: #0369a1;
  }
</style>
<rect width="640" height="476" fill="var(--bg)"/>
<text x="24" y="34" fill="var(--text)" font-size="20" font-weight="700" font-family="Lora Variable, Lora, Georgia, serif">Three questions every agent action must answer</text>
<text x="24" y="56" fill="var(--subtext)" font-size="12.5" text-anchor="start">The travel analogy, mapped to the IETF AIMS functions and to where the market is</text>
<line x1="24" y1="70" x2="616" y2="70" stroke="var(--c0)" stroke-width="2" opacity="0.35"/>
<text x="36" y="94" fill="var(--muted)" font-size="10.5" font-weight="700" text-anchor="start" letter-spacing="1">QUESTION</text>
<text x="214" y="94" fill="var(--muted)" font-size="10.5" font-weight="700" text-anchor="start" letter-spacing="1">AIMS FUNCTIONS</text>
<text x="472" y="94" fill="var(--muted)" font-size="10.5" font-weight="700" text-anchor="start" letter-spacing="1">STATE TODAY</text>
<rect x="16" y="104" width="608" height="96" rx="10" fill="var(--card)" stroke="var(--border)"/>
<rect x="16" y="104" width="6" height="96" rx="3" fill="var(--c4)"/>
<text x="36" y="134" fill="var(--text)" font-size="20" font-weight="700" font-family="Lora Variable, Lora, Georgia, serif">Why</text>
<text x="36" y="156" fill="var(--text)" font-size="12.5" text-anchor="start">Is this purpose</text>
<text x="36" y="172" fill="var(--text)" font-size="12.5" text-anchor="start">legitimate?</text>
<text x="36" y="190" fill="var(--subtext)" font-size="12" text-anchor="start" font-style="italic">Itinerary</text>
<rect x="214" y="120" width="115" height="28" rx="6" fill="var(--bg)" stroke="var(--c4)" stroke-width="1.2"/>
<text x="272" y="139" fill="var(--text)" font-size="12.5" text-anchor="middle">Mission</text>
<rect x="339" y="120" width="115" height="28" rx="6" fill="var(--bg)" stroke="var(--c4)" stroke-width="1.2"/>
<text x="396" y="139" fill="var(--text)" font-size="12.5" text-anchor="middle">7  Policy</text>
<rect x="214" y="156" width="240" height="28" rx="6" fill="var(--bg)" stroke="var(--c4)" stroke-width="1.2"/>
<text x="334" y="175" fill="var(--text)" font-size="12.5" text-anchor="middle">8  Compliance</text>
<text x="472" y="132" fill="var(--text)" font-size="14" font-weight="700" text-anchor="start">Emerging</text>
<text x="472" y="151" fill="var(--subtext)" font-size="11.5" text-anchor="start">Products can help.</text>
<text x="472" y="165" fill="var(--subtext)" font-size="11.5" text-anchor="start">Accountability can't</text>
<text x="472" y="179" fill="var(--subtext)" font-size="11.5" text-anchor="start">be outsourced.</text>
<rect x="16" y="210" width="608" height="96" rx="10" fill="var(--card)" stroke="var(--border)"/>
<rect x="16" y="210" width="6" height="96" rx="3" fill="var(--c1)"/>
<text x="36" y="240" fill="var(--text)" font-size="20" font-weight="700" font-family="Lora Variable, Lora, Georgia, serif">May it</text>
<text x="36" y="262" fill="var(--text)" font-size="12.5" text-anchor="start">May it do this, for</text>
<text x="36" y="278" fill="var(--text)" font-size="12.5" text-anchor="start">this person, now?</text>
<text x="36" y="296" fill="var(--subtext)" font-size="12" text-anchor="start" font-style="italic">Visa</text>
<rect x="214" y="226" width="240" height="28" rx="6" fill="var(--bg)" stroke="var(--c1)" stroke-width="1.2"/>
<text x="334" y="245" fill="var(--text)" font-size="12.5" text-anchor="middle">5  Authorization</text>
<rect x="214" y="262" width="240" height="28" rx="6" fill="var(--bg)" stroke="var(--c1)" stroke-width="1.2"/>
<text x="334" y="281" fill="var(--text)" font-size="12.5" text-anchor="middle">6  Observability and remediation</text>
<text x="472" y="238" fill="var(--text)" font-size="14" font-weight="700" text-anchor="start">Shipping,</text>
<text x="472" y="255" fill="var(--text)" font-size="14" font-weight="700" text-anchor="start">fragmented</text>
<text x="472" y="274" fill="var(--subtext)" font-size="11.5" text-anchor="start">Gateways and policy</text>
<text x="472" y="288" fill="var(--subtext)" font-size="11.5" text-anchor="start">engines, partly on drafts</text>
<rect x="16" y="316" width="608" height="96" rx="10" fill="var(--card)" stroke="var(--border)"/>
<rect x="16" y="316" width="6" height="96" rx="3" fill="var(--c2)"/>
<text x="36" y="346" fill="var(--text)" font-size="20" font-weight="700" font-family="Lora Variable, Lora, Georgia, serif">Who</text>
<text x="36" y="368" fill="var(--text)" font-size="12.5" text-anchor="start">Is this the agent</text>
<text x="36" y="384" fill="var(--text)" font-size="12.5" text-anchor="start">it claims to be?</text>
<text x="36" y="402" fill="var(--subtext)" font-size="12" text-anchor="start" font-style="italic">Passport</text>
<rect x="214" y="332" width="115" height="28" rx="6" fill="var(--bg)" stroke="var(--c2)" stroke-width="1.2"/>
<text x="272" y="351" fill="var(--text)" font-size="12.5" text-anchor="middle">1  Identifier</text>
<rect x="339" y="332" width="115" height="28" rx="6" fill="var(--bg)" stroke="var(--c2)" stroke-width="1.2"/>
<text x="396" y="351" fill="var(--text)" font-size="12.5" text-anchor="middle">2  Credentials</text>
<rect x="214" y="368" width="115" height="28" rx="6" fill="var(--bg)" stroke="var(--c2)" stroke-width="1.2"/>
<text x="272" y="387" fill="var(--text)" font-size="12.5" text-anchor="middle">3  Provisioning</text>
<rect x="339" y="368" width="115" height="28" rx="6" fill="var(--bg)" stroke="var(--c2)" stroke-width="1.2"/>
<text x="396" y="387" fill="var(--text)" font-size="12.5" text-anchor="middle">4  Authentication</text>
<text x="472" y="344" fill="var(--text)" font-size="14" font-weight="700" text-anchor="start">Becoming</text>
<text x="472" y="361" fill="var(--text)" font-size="14" font-weight="700" text-anchor="start">infrastructure</text>
<text x="472" y="380" fill="var(--subtext)" font-size="11.5" text-anchor="start">Agent identity is GA</text>
<text x="472" y="394" fill="var(--subtext)" font-size="11.5" text-anchor="start">from major vendors</text>
<line x1="214" y1="424" x2="454" y2="424" stroke="var(--c2)" stroke-width="2"/>
<text x="214" y="444" fill="var(--subtext)" font-size="12" text-anchor="start">SPIFFE and SPIRE cover the Who layer: workload identity and</text>
<text x="214" y="460" fill="var(--subtext)" font-size="12" text-anchor="start">authentication. Authorization is outside them by design.</text>
</svg>
