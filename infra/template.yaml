AWSTemplateFormatVersion: '2010-09-09'
Description: >
  khaledzaky.com — Static site infrastructure.
  S3, CloudFront, CodeBuild, Route 53 health check, CloudTrail, Budget.

Parameters:
  DomainName:
    Type: String
    Default: khaledzaky.com
  HostedZoneId:
    Type: String
    Description: Route 53 hosted zone ID for khaledzaky.com (no default — pass at deploy time)
  AcmCertificateArn:
    Type: String
    Description: ACM certificate ARN (must be in us-east-1 for CloudFront, no default — pass at deploy time)
  GitHubRepo:
    Type: String
    Default: https://github.com/kzaky/khaledzaky.com.git
  NotificationEmail:
    Type: String
    Description: Email for budget alerts and uptime alarms (no default — pass at deploy time)
  MonthlyBudgetAmount:
    Type: String
    Default: '25.0'

Resources:

  # S3 bucket + bucket policy are in storage.yaml (us-east-2 stack)
  # because the bucket is in us-east-2 and this stack is in us-east-1.


  # ============================================================
  # CloudFront — Origin Access Control
  # ============================================================
  OriginAccessControl:
    DeletionPolicy: Retain
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${DomainName}-oac"
        Description: !Sub "OAC for ${DomainName} S3 bucket"
        SigningProtocol: sigv4
        SigningBehavior: always
        OriginAccessControlOriginType: s3

  # ============================================================
  # CloudFront — Response Headers Policy (Security Headers)
  # ============================================================
  SecurityHeadersPolicy:
    DeletionPolicy: Retain
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      # Name is the live policy's: CloudFront policy names allow only letters,
      # digits, - and _, so "${DomainName}-..." (with the dot) was rejected as
      # "Invalid request" on every update since 2026-03-01, and the live policy was
      # edited by CLI instead. connect-src carries the /drop upload API and the
      # drafts bucket's presigned-URL hosts (src/pages/drop.astro); without them a
      # redeploy breaks /drop. /drop's form is submitted by fetch(), so
      # form-action 'self' is all it needs.
      ResponseHeadersPolicyConfig:
        Name: khaledzaky-security-headers
        Comment: !Sub "Security headers with CSP for ${DomainName}"
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: >-
              default-src 'self';
              script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://cdn.jsdelivr.net;
              img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com;
              style-src 'self' 'unsafe-inline';
              connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com
              https://2zgqukg9d8.execute-api.us-east-1.amazonaws.com
              https://blog-agent-drafts.s3.us-east-1.amazonaws.com https://blog-agent-drafts.s3.amazonaws.com;
              font-src 'self';
              frame-ancestors 'none';
              object-src 'none';
              base-uri 'self';
              form-action 'self'
          ContentTypeOptions:
            Override: true
          FrameOptions:
            Override: true
            FrameOption: DENY
          ReferrerPolicy:
            Override: true
            ReferrerPolicy: strict-origin-when-cross-origin
          StrictTransportSecurity:
            Override: true
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
          # X-XSS-Protection: 0. The legacy auditor is gone from current browsers
          # and its block mode could be abused for leaks in old ones; CSP covers it.
          XSSProtection:
            Override: true
            Protection: false
        # No site-wide X-Robots-Tag: "index, follow" is the default anyway and it
        # contradicted the noindex on /drop. /drop gets its header from
        # ViewerResponseFunction.
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: "camera=(), microphone=(), geolocation=(), interest-cohort=()"
              Override: true

  # ============================================================
  # CloudFront — Functions
  # The old IndexRewriteFunction resource was imported with Name
  # "khaledzaky.com-index-rewrite", but the live function is
  # "khaledzaky-index-rewrite" (a dot is not allowed in a function name).
  # Name is create-only, so CloudFormation could neither update that resource
  # nor rename it without a replacement that collides with the live name. It is
  # dropped from the template (Retain: the live function is kept, unattached)
  # and replaced by two functions with valid, new names.
  # viewer-request can return a redirect but cannot add response headers, so
  # the /drop X-Robots-Tag is set by a separate viewer-response function.
  # ============================================================
  ViewerRequestFunction:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::CloudFront::Function
    Properties:
      Name: khaledzaky-viewer-request
      AutoPublish: true
      FunctionConfig:
        Comment: 301 www to apex, /feed.xml to /rss.xml, /trust to /trust/; index.html rewrite
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function redirect(location) {
          return {
            statusCode: 301,
            statusDescription: 'Moved Permanently',
            headers: { 'location': { value: location } }
          };
        }
        function querystring(q) {
          var parts = [];
          for (var k in q) {
            var vals = q[k].multiValue || [q[k]];
            for (var i = 0; i < vals.length; i++) {
              parts.push(vals[i].value === '' ? k : k + '=' + vals[i].value);
            }
          }
          return parts.length ? '?' + parts.join('&') : '';
        }
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var host = request.headers.host ? request.headers.host.value : '';
          if (host === 'www.khaledzaky.com') {
            return redirect('https://khaledzaky.com' + uri + querystring(request.querystring));
          }
          if (uri === '/feed.xml') {
            return redirect('/rss.xml');
          }
          // /trust -> /trust/ so the workshop page's relative resources resolve
          // when the QR code or slides link without the slash.
          if (uri === '/trust') {
            return redirect('/trust/');
          }
          if (uri.endsWith('/')) {
            request.uri += 'index.html';
          } else if (!uri.includes('.')) {
            request.uri += '/index.html';
          }
          return request;
        }

  ViewerResponseFunction:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::CloudFront::Function
    Properties:
      Name: khaledzaky-viewer-response
      AutoPublish: true
      FunctionConfig:
        Comment: X-Robots-Tag noindex, nofollow on /drop
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var uri = event.request.uri;
          var response = event.response;
          if (uri === '/drop' || uri.startsWith('/drop/')) {
            response.headers['x-robots-tag'] = { value: 'noindex, nofollow' };
          }
          return response;
        }

  # ============================================================
  # CloudFront — Distribution
  # ============================================================
  Distribution:
    DeletionPolicy: Retain
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${DomainName} static site"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases:
          - !Ref DomainName
          - !Sub "www.${DomainName}"
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: S3Origin
            DomainName: !Sub "${DomainName}.s3.us-east-2.amazonaws.com"
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ViewerRequestFunction.FunctionARN
            - EventType: viewer-response
              FunctionARN: !GetAtt ViewerResponseFunction.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponsePagePath: /404.html
            ResponseCode: 404
            ErrorCachingMinTTL: 300
          - ErrorCode: 404
            ResponsePagePath: /404.html
            ResponseCode: 404
            ErrorCachingMinTTL: 300

  # ============================================================
  # CodeBuild — IAM Role
  # ============================================================
  CodeBuildRole:
    DeletionPolicy: Retain
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "codebuild_${DomainName}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/khaledzaky_com"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/khaledzaky_com:*"
        - PolicyName: S3SiteAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub "arn:aws:s3:::${DomainName}/*"
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub "arn:aws:s3:::${DomainName}"
        - PolicyName: CloudFrontInvalidation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
        - PolicyName: SSMReadDistId
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudfront_distid"
        - PolicyName: CodeBuildReports
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - codebuild:CreateReportGroup
                  - codebuild:CreateReport
                  - codebuild:UpdateReport
                  - codebuild:BatchPutTestCases
                  - codebuild:BatchPutCodeCoverages
                Resource: !Sub "arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:report-group/khaledzaky_com-*"

  # CodeBuild project khaledzaky_com is managed outside this stack
  # (AWS::CodeBuild::Project does not support import). The commented-out
  # resource for a future CFN-managed project is in git history (5916272).

  # ============================================================
  # Route 53 — Health Check + CloudWatch Alarm
  # ============================================================
  UptimeHealthCheck:
    DeletionPolicy: Retain
    Type: AWS::Route53::HealthCheck
    Properties:
      HealthCheckConfig:
        Type: HTTPS
        FullyQualifiedDomainName: !Ref DomainName
        ResourcePath: /
        RequestInterval: 30
        FailureThreshold: 3
        EnableSNI: true

  SiteDownAlarm:
    DeletionPolicy: Retain
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: khaledzaky-site-down
      AlarmDescription: !Sub "${DomainName} is DOWN"
      Namespace: AWS/Route53
      MetricName: HealthCheckStatus
      Dimensions:
        - Name: HealthCheckId
          Value: !Ref UptimeHealthCheck
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:blog-agent-review"

  # ============================================================
  # CloudWatch — Dashboard
  # ============================================================
  InfraDashboard:
    DeletionPolicy: Retain
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: khaledzaky-infra
      DashboardBody: !Sub |
        {
          "widgets": [

            {
              "type": "text",
              "x": 0, "y": 0, "width": 24, "height": 1,
              "properties": { "markdown": "# khaledzaky.com — Observability Dashboard" }
            },

            {
              "type": "text",
              "x": 0, "y": 1, "width": 24, "height": 1,
              "properties": { "markdown": "## Site Traffic & Performance" }
            },
            {
              "type": "metric",
              "x": 0, "y": 2, "width": 8, "height": 6,
              "properties": {
                "title": "Requests",
                "metrics": [["AWS/CloudFront", "Requests", "DistributionId", "${Distribution}", "Region", "Global", {"stat": "Sum", "period": 3600}]],
                "view": "timeSeries", "region": "us-east-1", "period": 3600
              }
            },
            {
              "type": "metric",
              "x": 8, "y": 2, "width": 8, "height": 6,
              "properties": {
                "title": "Bytes Downloaded + Uploaded",
                "metrics": [
                  ["AWS/CloudFront", "BytesDownloaded", "DistributionId", "${Distribution}", "Region", "Global", {"stat": "Sum", "period": 3600, "label": "Downloaded"}],
                  ["AWS/CloudFront", "BytesUploaded", "DistributionId", "${Distribution}", "Region", "Global", {"stat": "Sum", "period": 3600, "label": "Uploaded", "color": "#ff9900"}]
                ],
                "view": "timeSeries", "region": "us-east-1", "period": 3600
              }
            },
            {
              "type": "metric",
              "x": 16, "y": 2, "width": 8, "height": 6,
              "properties": {
                "title": "Origin Latency (ms) — S3 response time",
                "metrics": [
                  ["AWS/CloudFront", "OriginLatency", "DistributionId", "${Distribution}", "Region", "Global", {"stat": "Average", "period": 3600, "label": "avg"}],
                  ["AWS/CloudFront", "OriginLatency", "DistributionId", "${Distribution}", "Region", "Global", {"stat": "p99", "period": 3600, "label": "p99"}]
                ],
                "view": "timeSeries", "region": "us-east-1", "period": 3600
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 8, "width": 8, "height": 6,
              "properties": {
                "title": "Cache Hit Rate (%)",
                "metrics": [["AWS/CloudFront", "CacheHitRate", "DistributionId", "${Distribution}", "Region", "Global", {"stat": "Average", "period": 3600}]],
                "view": "timeSeries", "region": "us-east-1", "period": 3600,
                "yAxis": {"left": {"min": 0, "max": 100}}
              }
            },
            {
              "type": "metric",
              "x": 8, "y": 8, "width": 8, "height": 6,
              "properties": {
                "title": "Error Rate — 4xx",
                "metrics": [["AWS/CloudFront", "4xxErrorRate", "DistributionId", "${Distribution}", "Region", "Global", {"stat": "Average", "period": 3600}]],
                "view": "timeSeries", "region": "us-east-1", "period": 3600,
                "yAxis": {"left": {"min": 0}}
              }
            },
            {
              "type": "metric",
              "x": 16, "y": 8, "width": 8, "height": 6,
              "properties": {
                "title": "Error Rate — 5xx",
                "metrics": [["AWS/CloudFront", "5xxErrorRate", "DistributionId", "${Distribution}", "Region", "Global", {"stat": "Average", "period": 3600}]],
                "view": "timeSeries", "region": "us-east-1", "period": 3600,
                "yAxis": {"left": {"min": 0}},
                "annotations": {"horizontal": [{"label": "Alert threshold", "value": 1, "color": "#d13212"}]}
              }
            },
            {
              "type": "text",
              "x": 0, "y": 14, "width": 24, "height": 2,
              "properties": { "markdown": "**Requests** counts CloudFront cache hits + misses per hour — a spike here means real traffic, not just crawlers. **Bytes Downloaded** is outbound traffic to visitors; **BytesUploaded** should be near zero — a spike means unexpected PUT traffic hitting CloudFront. **Origin Latency** is how fast S3 responds when CloudFront does need to fetch from origin; avg under 50ms is normal, sustained p99 above 500ms suggests S3 cross-region latency or throttling. **Cache hit rate** typically runs 40-60% — HTML is always revalidated, static assets are cached immutably. **4xx** spikes mean broken links or missing assets; **5xx** triggers the site-down alarm." }
            },

            {
              "type": "text",
              "x": 0, "y": 16, "width": 24, "height": 1,
              "properties": { "markdown": "## Health & Availability" }
            },
            {
              "type": "metric",
              "x": 0, "y": 17, "width": 12, "height": 6,
              "properties": {
                "title": "Site Up (Route 53 Health Check)",
                "metrics": [["AWS/Route53", "HealthCheckStatus", "HealthCheckId", "${UptimeHealthCheck}", {"stat": "Minimum", "period": 60}]],
                "view": "timeSeries", "region": "us-east-1", "period": 60,
                "yAxis": {"left": {"min": 0, "max": 1}},
                "annotations": {"horizontal": [{"label": "Healthy", "value": 1, "color": "#2ca02c"}]}
              }
            },
            {
              "type": "alarm",
              "x": 12, "y": 17, "width": 12, "height": 6,
              "properties": {
                "title": "Alarm Status",
                "alarms": [
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:khaledzaky-site-down",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:khaledzaky-codebuild-failure",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:khaledzaky-s3-4xx-errors",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:khaledzaky-s3-5xx-errors",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:khaledzaky-cloudfront-low-cache-hit-rate",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:blog-agent-pipeline-failure",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:blog-agent-pipeline-timed-out",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:blog-agent-pipeline-aborted",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:blog-agent-lambda-errors-any",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:blog-agent-api-5xx",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:blog-agent-ingest-dlq-not-empty",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:blog-agent-opus-model-fallback"
                ]
              }
            },
            {
              "type": "text",
              "x": 0, "y": 23, "width": 24, "height": 2,
              "properties": { "markdown": "**Site Up** is a Route 53 health check polling the homepage every 60 s — 1 means healthy, 0 means unreachable and the alarm fires. **Alarm Status** shows every alarm in one grid: the site alarms (site-down; codebuild, S3 and cache-hit alarms are managed by CLI) and the blog-agent stack's (pipeline failed, timed out or aborted, lambda-errors-any, api-5xx, ingest DLQ, Opus fallback). Any red here means a notification already went to your email. If site-down and lambda-errors-any fire together, check CloudFront and the ingest function first." }
            },

            {
              "type": "text",
              "x": 0, "y": 25, "width": 24, "height": 1,
              "properties": { "markdown": "## Deployments (CodeBuild)" }
            },
            {
              "type": "metric",
              "x": 0, "y": 26, "width": 8, "height": 6,
              "properties": {
                "title": "Builds",
                "metrics": [
                  ["AWS/CodeBuild", "Builds", "ProjectName", "khaledzaky_com", {"stat": "Sum", "period": 86400, "label": "Total"}],
                  ["AWS/CodeBuild", "FailedBuilds", "ProjectName", "khaledzaky_com", {"stat": "Sum", "period": 86400, "label": "Failed", "color": "#d13212"}]
                ],
                "view": "timeSeries", "region": "us-east-1", "period": 86400
              }
            },
            {
              "type": "metric",
              "x": 8, "y": 26, "width": 8, "height": 6,
              "properties": {
                "title": "Build Duration (ms)",
                "metrics": [
                  ["AWS/CodeBuild", "Duration", "ProjectName", "khaledzaky_com", {"stat": "Average", "period": 86400, "label": "avg"}],
                  ["AWS/CodeBuild", "Duration", "ProjectName", "khaledzaky_com", {"stat": "p99", "period": 86400, "label": "p99"}]
                ],
                "view": "timeSeries", "region": "us-east-1", "period": 86400
              }
            },
            {
              "type": "metric",
              "x": 16, "y": 26, "width": 8, "height": 6,
              "properties": {
                "title": "Succeeded vs Failed (cumulative)",
                "metrics": [
                  ["AWS/CodeBuild", "SucceededBuilds", "ProjectName", "khaledzaky_com", {"stat": "Sum", "period": 86400, "label": "Succeeded", "color": "#2ca02c"}],
                  ["AWS/CodeBuild", "FailedBuilds", "ProjectName", "khaledzaky_com", {"stat": "Sum", "period": 86400, "label": "Failed", "color": "#d13212"}]
                ],
                "view": "timeSeries", "region": "us-east-1", "period": 86400
              }
            },
            {
              "type": "text",
              "x": 0, "y": 32, "width": 24, "height": 2,
              "properties": { "markdown": "**Builds** shows total deploys per day — each git push to master triggers one. **Failed builds** should be zero; a failure means the site was not updated and you need to check the CodeBuild console for the error (usually a broken npm install, audit failure, or S3 sync issue). **Build duration** averages 2-4 minutes; a sustained increase means a dependency install is getting slower or the bundle is growing." }
            },

            {
              "type": "text",
              "x": 0, "y": 34, "width": 24, "height": 1,
              "properties": { "markdown": "## Blog Agent — Lambda Functions" }
            },
            {
              "type": "metric",
              "x": 0, "y": 35, "width": 12, "height": 6,
              "properties": {
                "title": "Invocations (by function, daily)",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "blog-agent-ingest", {"stat": "Sum", "period": 86400}],
                  ["AWS/Lambda", "Invocations", "FunctionName", "blog-agent-research", {"stat": "Sum", "period": 86400}],
                  ["AWS/Lambda", "Invocations", "FunctionName", "blog-agent-draft", {"stat": "Sum", "period": 86400}],
                  ["AWS/Lambda", "Invocations", "FunctionName", "blog-agent-verify", {"stat": "Sum", "period": 86400}],
                  ["AWS/Lambda", "Invocations", "FunctionName", "blog-agent-evaluate", {"stat": "Sum", "period": 86400}],
                  ["AWS/Lambda", "Invocations", "FunctionName", "blog-agent-chart", {"stat": "Sum", "period": 86400}],
                  ["AWS/Lambda", "Invocations", "FunctionName", "blog-agent-notify", {"stat": "Sum", "period": 86400}],
                  ["AWS/Lambda", "Invocations", "FunctionName", "blog-agent-approve", {"stat": "Sum", "period": 86400}],
                  ["AWS/Lambda", "Invocations", "FunctionName", "blog-agent-publish", {"stat": "Sum", "period": 86400}],
                  ["AWS/Lambda", "Invocations", "FunctionName", "blog-agent-upload", {"stat": "Sum", "period": 86400}]
                ],
                "view": "timeSeries", "region": "us-east-1", "period": 86400
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 35, "width": 12, "height": 6,
              "properties": {
                "title": "Errors (by function, daily)",
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "blog-agent-ingest", {"stat": "Sum", "period": 86400}],
                  ["AWS/Lambda", "Errors", "FunctionName", "blog-agent-research", {"stat": "Sum", "period": 86400}],
                  ["AWS/Lambda", "Errors", "FunctionName", "blog-agent-draft", {"stat": "Sum", "period": 86400}],
                  ["AWS/Lambda", "Errors", "FunctionName", "blog-agent-verify", {"stat": "Sum", "period": 86400}],
                  ["AWS/Lambda", "Errors", "FunctionName", "blog-agent-evaluate", {"stat": "Sum", "period": 86400}],
                  ["AWS/Lambda", "Errors", "FunctionName", "blog-agent-chart", {"stat": "Sum", "period": 86400}],
                  ["AWS/Lambda", "Errors", "FunctionName", "blog-agent-notify", {"stat": "Sum", "period": 86400}],
                  ["AWS/Lambda", "Errors", "FunctionName", "blog-agent-approve", {"stat": "Sum", "period": 86400}],
                  ["AWS/Lambda", "Errors", "FunctionName", "blog-agent-publish", {"stat": "Sum", "period": 86400}],
                  ["AWS/Lambda", "Errors", "FunctionName", "blog-agent-upload", {"stat": "Sum", "period": 86400}]
                ],
                "view": "timeSeries", "region": "us-east-1", "period": 86400
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 41, "width": 8, "height": 6,
              "properties": {
                "title": "Duration — avg (ms)",
                "metrics": [
