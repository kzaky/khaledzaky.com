<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 396" font-family="Inter Variable, Inter, system-ui, -apple-system, sans-serif">
<style>
  :root {
    --bg: #ffffff; --card: #f9fafb; --border: #e5e7eb;
    --text: #111827; --subtext: #6b7280; --muted: #9ca3af;
    --c0: #0284c7; --c1: #d97706; --c2: #059669; --c3: #dc2626;
    --c4: #7c3aed; --c5: #db2777; --c6: #0891b2; --c7: #ea580c;
    --on-primary: white; --detail: #bfdbfe; --item-bg: #f0f9ff;
    --s1: #e0f2fe; --s2: #7dd3fc; --s3: #0ea5e9; --s4: #0369a1;
  }
  .dark svg {
    --bg: #030712; --card: #111827; --border: #1f2937;
    --text: #f9fafb; --subtext: #9ca3af; --muted: #6b7280;
    --c0: #38bdf8; --c1: #fbbf24; --c2: #34d399; --c3: #f87171;
    --c4: #a78bfa; --c5: #f472b6; --c6: #22d3ee; --c7: #fb923c;
    --on-primary: white; --detail: #7dd3fc; --item-bg: #0c4a6e;
    --s1: #082f49; --s2: #0c4a6e; --s3: #075985; --s4: #0369a1;
  }
</style>
<rect width="700" height="396" fill="var(--bg)"/>
<text x="30" y="30" text-anchor="start" fill="var(--text)" font-size="20" font-weight="700" font-family="Lora Variable, Lora, Georgia, serif">A typed decision interface</text>
<line x1="30" y1="42" x2="670" y2="42" stroke="var(--c0)" stroke-width="2" opacity="0.35"/>
<rect x="170" y="70" width="360" height="52" fill="var(--item-bg)" rx="6" stroke="var(--c0)" stroke-width="2"/>
<text x="350" y="100" text-anchor="middle" fill="var(--text)" font-size="12" font-weight="600">Application state</text>
<line x1="350" y1="122" x2="350" y2="147" stroke="var(--subtext)" stroke-width="1.5"/>
<polygon points="350,154 346,147 354,147" fill="var(--subtext)"/>
<rect x="170" y="154" width="360" height="52" fill="var(--item-bg)" rx="6" stroke="var(--c0)" stroke-width="2"/>
<text x="350" y="184" text-anchor="middle" fill="var(--text)" font-size="12" font-weight="600">A bounded semantic question</text>
<line x1="350" y1="206" x2="350" y2="231" stroke="var(--subtext)" stroke-width="1.5"/>
<polygon points="350,238 346,231 354,231" fill="var(--subtext)"/>
<rect x="170" y="238" width="360" height="52" fill="var(--item-bg)" rx="6" stroke="var(--c0)" stroke-width="2"/>
<text x="350" y="268" text-anchor="middle" fill="var(--text)" font-size="12" font-weight="600">Probabilities over defined answers</text>
<line x1="350" y1="290" x2="350" y2="315" stroke="var(--subtext)" stroke-width="1.5"/>
<polygon points="350,322 346,315 354,315" fill="var(--subtext)"/>
<rect x="170" y="322" width="360" height="52" fill="var(--item-bg)" rx="6" stroke="var(--c0)" stroke-width="2"/>
<text x="350" y="352" text-anchor="middle" fill="var(--text)" font-size="12" font-weight="600">Application policy</text>
</svg>