<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 276" font-family="Inter Variable, Inter, system-ui, -apple-system, sans-serif">
<style>
  :root {
    --bg: #ffffff; --card: #f9fafb; --border: #e5e7eb;
    --text: #111827; --subtext: #6b7280; --muted: #9ca3af;
    --c0: #0284c7; --c1: #d97706; --c2: #059669; --c3: #dc2626;
    --c4: #7c3aed; --c5: #db2777; --c6: #0891b2; --c7: #ea580c;
    --on-primary: white; --detail: #bfdbfe; --item-bg: #f0f9ff;
    --s1: #e0f2fe; --s2: #7dd3fc; --s3: #0ea5e9; --s4: #0369a1;
  }
  .dark svg {
    --bg: #030712; --card: #111827; --border: #1f2937;
    --text: #f9fafb; --subtext: #9ca3af; --muted: #6b7280;
    --c0: #38bdf8; --c1: #fbbf24; --c2: #34d399; --c3: #f87171;
    --c4: #a78bfa; --c5: #f472b6; --c6: #22d3ee; --c7: #fb923c;
    --on-primary: white; --detail: #7dd3fc; --item-bg: #0c4a6e;
    --s1: #082f49; --s2: #0c4a6e; --s3: #075985; --s4: #0369a1;
  }
  :root { --jev: #0284c7; --laya: #d97706; }
</style>
<rect width="700" height="276" fill="var(--bg)"/>
<text x="30" y="28" fill="var(--text)" font-size="18" font-weight="700" font-family="Lora Variable, Lora, Georgia, serif">Jev and Laya accuracy on CLINC150</text>
<text x="30" y="48" fill="var(--subtext)" font-size="12">Share of 1,000 requests answered correctly, asked directly vs in two steps</text>
<line x1="30" y1="60" x2="670" y2="60" stroke="var(--c0)" stroke-width="2" opacity="0.35"/>
<rect x="200" y="72" width="12" height="12" rx="2" fill="var(--jev)"/>
<text x="218" y="82" fill="var(--text)" font-size="12">Jev</text>
<rect x="256" y="72" width="12" height="12" rx="2" fill="var(--laya)"/>
<text x="274" y="82" fill="var(--text)" font-size="12">Laya</text>
<line x1="200" y1="96" x2="200" y2="236" stroke="var(--border)" stroke-width="1"/>
<text x="200" y="254" text-anchor="middle" fill="var(--muted)" font-size="10">0%</text>
<line x1="305" y1="96" x2="305" y2="236" stroke="var(--border)" stroke-width="1"/>
<text x="305" y="254" text-anchor="middle" fill="var(--muted)" font-size="10">25%</text>
<line x1="410" y1="96" x2="410" y2="236" stroke="var(--border)" stroke-width="1"/>
<text x="410" y="254" text-anchor="middle" fill="var(--muted)" font-size="10">50%</text>
<line x1="515" y1="96" x2="515" y2="236" stroke="var(--border)" stroke-width="1"/>
<text x="515" y="254" text-anchor="middle" fill="var(--muted)" font-size="10">75%</text>
<line x1="620" y1="96" x2="620" y2="236" stroke="var(--border)" stroke-width="1"/>
<text x="620" y="254" text-anchor="middle" fill="var(--muted)" font-size="10">100%</text>
<text x="188" y="131" text-anchor="end" fill="var(--text)" font-size="12" font-weight="600">Asked directly</text>
<path d="M200,100 h378.2 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-378.2 z" fill="var(--jev)"><title>Jev, asked directly: 91.0%</title></path>
<text x="590.2" y="118" fill="var(--text)" font-size="12"><tspan font-weight="700">91.0%</tspan><tspan fill="var(--subtext)" dx="6">Jev</tspan></text>
<path d="M200,128 h93.0 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-93.0 z" fill="var(--laya)"><title>Laya, asked directly: 23.1%</title></path>
<text x="305.0" y="146" fill="var(--text)" font-size="12"><tspan font-weight="700">23.1%</tspan><tspan fill="var(--subtext)" dx="6">Laya</tspan></text>
<text x="188" y="207" text-anchor="end" fill="var(--text)" font-size="12" font-weight="600">Asked in two steps</text>
<path d="M200,176 h282.0 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-282.0 z" fill="var(--jev)"><title>Jev, asked in two steps: 68.1%</title></path>
<text x="494.0" y="194" fill="var(--text)" font-size="12"><tspan font-weight="700">68.1%</tspan><tspan fill="var(--subtext)" dx="6">Jev</tspan></text>
<path d="M200,204 h182.5 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-182.5 z" fill="var(--laya)"><title>Laya, asked in two steps: 44.4%</title></path>
<text x="394.5" y="222" fill="var(--text)" font-size="12"><tspan font-weight="700">44.4%</tspan><tspan fill="var(--subtext)" dx="6">Laya</tspan></text>
<line x1="200" y1="96" x2="200" y2="236" stroke="var(--subtext)" stroke-width="1"/>
</svg>
