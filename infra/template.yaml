# ============================================================
Outputs:
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  HealthCheckId:
    Value: !Ref UptimeHealthCheck
  SecurityHeadersPolicyId:
    Value: !Ref SecurityHeadersPolicy
