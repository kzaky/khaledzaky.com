<text x="24" y="62" fill="var(--kz-text)" font-size="21" text-anchor="start" font-weight="700" font-family="Lora Variable, Lora, Georgia, serif">Who decides, who enforces, who answers for it</text>
<text x="24" y="84" fill="var(--kz-muted)" font-size="13" text-anchor="start">One agent action, from an approved mission to the evidence that it matched</text>
