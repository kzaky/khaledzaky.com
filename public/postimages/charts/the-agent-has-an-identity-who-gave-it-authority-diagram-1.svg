<text x="44" y="228" fill="var(--kz-accent)" font-size="13" text-anchor="start" font-family="Lora Variable, Lora, Georgia, serif" font-style="italic">The itinerary</text>
<text x="252" y="168" fill="var(--kz-text)" font-size="13.5" text-anchor="start">Mission</text>
<text x="236" y="190" fill="var(--kz-accent)" font-size="13.5" text-anchor="start" font-weight="700" font-family="Lora Variable, Lora, Georgia, serif">7</text>
<text x="252" y="190" fill="var(--kz-text)" font-size="13.5" text-anchor="start">Policy</text>
