<text x="262" y="156" fill="var(--kz-text)" font-size="14" text-anchor="start" font-weight="600">Set the constraints</text>
<text x="262" y="175" fill="var(--kz-muted)" font-size="12.5" text-anchor="start">The mission becomes scope</text>
