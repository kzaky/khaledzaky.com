<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 398" font-family="Inter Variable, Inter, system-ui, -apple-system, sans-serif">
<style>
  :root {
    --bg: #ffffff; --card: #f9fafb; --border: #e5e7eb;
    --text: #111827; --subtext: #6b7280; --muted: #9ca3af;
    --c0: #0284c7; --c1: #d97706; --c2: #059669; --c3: #dc2626;
    --c4: #7c3aed; --c5: #db2777; --c6: #0891b2; --c7: #ea580c;
    --on-primary: white; --detail: #bfdbfe; --item-bg: #f0f9ff;
    --s1: #e0f2fe; --s2: #7dd3fc; --s3: #0ea5e9; --s4: #0369a1;
  }
  .dark svg {
    --bg: #030712; --card: #111827; --border: #1f2937;
    --text: #f9fafb; --subtext: #9ca3af; --muted: #6b7280;
    --c0: #38bdf8; --c1: #fbbf24; --c2: #34d399; --c3: #f87171;
    --c4: #a78bfa; --c5: #f472b6; --c6: #22d3ee; --c7: #fb923c;
    --on-primary: white; --detail: #7dd3fc; --item-bg: #0c4a6e;
    --s1: #082f49; --s2: #0c4a6e; --s3: #075985; --s4: #0369a1;
  }
</style>
<rect width="700" height="398" fill="var(--bg)"/>
<text x="30" y="24" text-anchor="start" fill="var(--text)" font-size="18" font-weight="700" font-family="Lora Variable, Lora, Georgia, serif">Bar chart showing software testing as percentage of total</text>
<text x="30" y="46" text-anchor="start" fill="var(--text)" font-size="18" font-weight="700" font-family="Lora Variable, Lora, Georgia, serif">development budget: Low-complexity (12.5%), Standard (25%),</text>
<text x="30" y="68" text-anchor="start" fill="var(--text)" font-size="18" font-weight="700" font-family="Lora Variable, Lora, Georgia, serif">Regulated/complex (35%), Safety-critical (50%+). Source:</text>
<text x="30" y="90" text-anchor="start" fill="var(--text)" font-size="18" font-weight="700" font-family="Lora Variable, Lora, Georgia, serif">Idealink Tech</text>
<line x1="30" y1="102" x2="670" y2="102" stroke="var(--c0)" stroke-width="2" opacity="0.35"/>
<text x="206" y="147" text-anchor="end" fill="var(--subtext)" font-size="11">Low-complexity projects</text>
<rect x="220" y="118" width="97.5" height="48" fill="var(--c0)" rx="3"/>
<text x="329.5" y="149" fill="var(--text)" font-size="18" font-weight="800" font-family="Inter Variable, Inter, system-ui, -apple-system, sans-serif">12.5</text>
<text x="206" y="211" text-anchor="end" fill="var(--subtext)" font-size="11">Standard projects</text>
<rect x="220" y="182" width="195.0" height="48" fill="var(--c0)" rx="3"/>
<text x="427.0" y="213" fill="var(--text)" font-size="18" font-weight="800" font-family="Inter Variable, Inter, system-ui, -apple-system, sans-serif">25</text>
<text x="206" y="275" text-anchor="end" fill="var(--subtext)" font-size="11">Regulated/complex projects</text>
<rect x="220" y="246" width="273.0" height="48" fill="var(--c0)" rx="3"/>
<text x="505.0" y="277" fill="var(--text)" font-size="18" font-weight="800" font-family="Inter Variable, Inter, system-ui, -apple-system, sans-serif">35</text>
<text x="206" y="339" text-anchor="end" fill="var(--subtext)" font-size="11">Safety-critical systems</text>
<rect x="220" y="310" width="390.0" height="48" fill="var(--c0)" rx="3"/>
<text x="622.0" y="341" fill="var(--text)" font-size="18" font-weight="800" font-family="Inter Variable, Inter, system-ui, -apple-system, sans-serif">50</text>
</svg>
