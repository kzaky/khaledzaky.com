<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 180" font-family="Inter Variable, Inter, system-ui, -apple-system, sans-serif">
<style>
  :root {
    --bg: #ffffff; --card: #f9fafb; --border: #e5e7eb;
    --text: #111827; --subtext: #6b7280; --muted: #9ca3af;
    --c0: #0284c7; --c1: #d97706; --c2: #059669; --c3: #dc2626;
    --c4: #7c3aed; --c5: #db2777; --c6: #0891b2; --c7: #ea580c;
    --on-primary: white; --detail: #bfdbfe; --item-bg: #f0f9ff;
    --s1: #e0f2fe; --s2: #7dd3fc; --s3: #0ea5e9; --s4: #0369a1;
  }
  .dark svg {
    --bg: #030712; --card: #111827; --border: #1f2937;
    --text: #f9fafb; --subtext: #9ca3af; --muted: #6b7280;
    --c0: #38bdf8; --c1: #fbbf24; --c2: #34d399; --c3: #f87171;
    --c4: #a78bfa; --c5: #f472b6; --c6: #22d3ee; --c7: #fb923c;
    --on-primary: white; --detail: #7dd3fc; --item-bg: #0c4a6e;
    --s1: #082f49; --s2: #0c4a6e; --s3: #075985; --s4: #0369a1;
  }
</style>
<rect width="700" height="180" fill="var(--bg)"/>
<text x="30" y="30" text-anchor="start" fill="var(--text)" font-size="20" font-weight="700" font-family="Lora Variable, Lora, Georgia, serif">When the evaluator is unavailable</text>
<line x1="30" y1="42" x2="670" y2="42" stroke="var(--c0)" stroke-width="2" opacity="0.35"/>
<rect x="40" y="88" width="300" height="52" fill="var(--item-bg)" rx="6" stroke="var(--c0)" stroke-width="2"/>
<text x="190" y="118" text-anchor="middle" fill="var(--text)" font-size="12" font-weight="600">Evaluator unavailable after retries</text>
<path d="M 340 114 H 366 V 90 H 412" fill="none" stroke="var(--subtext)" stroke-width="1.5"/>
<polygon points="420,90 413,86 413,94" fill="var(--subtext)"/>
<text x="370" y="84" fill="var(--subtext)" font-size="10">Default</text>
<rect x="420" y="70" width="240" height="40" fill="var(--card)" rx="6" stroke="var(--c1)" stroke-width="2"/>
<text x="540" y="94" text-anchor="middle" fill="var(--text)" font-size="11" font-weight="600">Allow call</text>
<path d="M 340 114 H 366 V 138 H 412" fill="none" stroke="var(--subtext)" stroke-width="1.5"/>
<polygon points="420,138 413,134 413,142" fill="var(--subtext)"/>
<text x="370" y="132" fill="var(--subtext)" font-size="10">on_error=&quot;block&quot;</text>
<rect x="420" y="118" width="240" height="40" fill="var(--card)" rx="6" stroke="var(--c1)" stroke-width="2"/>
<text x="540" y="142" text-anchor="middle" fill="var(--text)" font-size="11" font-weight="600">Block call</text>
</svg>