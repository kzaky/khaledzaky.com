<circle cx="481" cy="384" r="4.5" fill="var(--kz-accent)" stroke="var(--kz-accent)" stroke-width="1.2"/>
<circle cx="495" cy="384" r="4.5" fill="var(--kz-accent)" stroke="var(--kz-accent)" stroke-width="1.2"/>
<text x="462" y="408" fill="var(--kz-text)" font-size="13.5" text-anchor="start" font-weight="600">Becoming</text>
<text x="462" y="425" fill="var(--kz-text)" font-size="13.5" text-anchor="start" font-weight="600">infrastructure</text>
<text x="462" y="443" fill="var(--kz-muted)" font-size="12" text-anchor="start">Agent identity is GA</text>
