<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 530" font-family="Inter Variable, Inter, system-ui, -apple-system, sans-serif">
<style>
  :root {
    --bg: #ffffff; --card: #f9fafb; --border: #e5e7eb;
    --text: #111827; --subtext: #6b7280; --muted: #9ca3af;
    --c0: #0284c7; --c1: #d97706; --c2: #059669; --c3: #dc2626;
    --c4: #7c3aed; --c5: #db2777; --c6: #0891b2; --c7: #ea580c;
    --on-primary: white; --detail: #bfdbfe; --item-bg: #f0f9ff;
    --s1: #e0f2fe; --s2: #7dd3fc; --s3: #0ea5e9; --s4: #0369a1;
  }
  .dark svg {
    --bg: #030712; --card: #111827; --border: #1f2937;
    --text: #f9fafb; --subtext: #9ca3af; --muted: #6b7280;
    --c0: #38bdf8; --c1: #fbbf24; --c2: #34d399; --c3: #f87171;
    --c4: #a78bfa; --c5: #f472b6; --c6: #22d3ee; --c7: #fb923c;
    --on-primary: white; --detail: #7dd3fc; --item-bg: #0c4a6e;
    --s1: #082f49; --s2: #0c4a6e; --s3: #075985; --s4: #0369a1;
  }
</style>
<rect width="700" height="530" fill="var(--bg)"/>
<text x="350" y="34" text-anchor="middle" fill="var(--text)" font-size="20" font-weight="700" font-family="Lora Variable, Lora, Georgia, serif">Graduated Intervention Response</text>
<line x1="30" y1="46" x2="670" y2="46" stroke="var(--c0)" stroke-width="2" opacity="0.35"/>
<rect x="40" y="420" width="140" height="70" fill="var(--s1)" rx="6" stroke="var(--border)" stroke-width="1"/>
<text x="110" y="442" text-anchor="middle" fill="var(--text)" font-size="13" font-weight="700">Stage 1</text>
<text x="110" y="458" text-anchor="middle" fill="var(--text)" font-size="11">Throttle</text>
<text x="110" y="474" text-anchor="middle" fill="var(--subtext)" font-size="8">Reduce rate or capacity</text>
<text x="110" y="486" text-anchor="middle" fill="var(--subtext)" font-size="8">Least disruptive</text>
<rect x="144" y="350" width="140" height="140" fill="var(--s2)" rx="6" stroke="var(--border)" stroke-width="1"/>
<text x="214" y="372" text-anchor="middle" fill="var(--text)" font-size="13" font-weight="700">Stage 2</text>
<text x="214" y="388" text-anchor="middle" fill="var(--text)" font-size="11">Restrict Capability</text>
<text x="214" y="404" text-anchor="middle" fill="var(--subtext)" font-size="8">Revoke a specific tool or</text>
<text x="214" y="416" text-anchor="middle" fill="var(--subtext)" font-size="8">permission</text>
<text x="214" y="428" text-anchor="middle" fill="var(--subtext)" font-size="8">Targeted containment</text>
<rect x="248" y="280" width="140" height="210" fill="var(--s3)" rx="6" stroke="var(--border)" stroke-width="1"/>
<text x="318" y="302" text-anchor="middle" fill="var(--text)" font-size="13" font-weight="700">Stage 3</text>
<text x="318" y="318" text-anchor="middle" fill="var(--text)" font-size="11">Suspend Workflow</text>
<text x="318" y="334" text-anchor="middle" fill="var(--subtext)" font-size="8">Pause in-flight</text>
<text x="318" y="346" text-anchor="middle" fill="var(--subtext)" font-size="8">orchestration</text>
<text x="318" y="358" text-anchor="middle" fill="var(--subtext)" font-size="8">Preserves state for review</text>
<rect x="352" y="210" width="140" height="280" fill="var(--s4)" rx="6" stroke="var(--border)" stroke-width="1"/>
<text x="422" y="232" text-anchor="middle" fill="var(--text)" font-size="13" font-weight="700">Stage 4</text>
<text x="422" y="248" text-anchor="middle" fill="var(--text)" font-size="11">Isolate Runtime</text>
<text x="422" y="264" text-anchor="middle" fill="var(--subtext)" font-size="8">Cut network and tool access</text>
<text x="422" y="276" text-anchor="middle" fill="var(--subtext)" font-size="8">Stops new side effects</text>
<rect x="456" y="140" width="140" height="350" fill="var(--s4)" rx="6" stroke="var(--border)" stroke-width="1"/>
<text x="526" y="162" text-anchor="middle" fill="var(--text)" font-size="13" font-weight="700">Stage 5</text>
<text x="526" y="178" text-anchor="middle" fill="var(--text)" font-size="11">Quarantine Agent</text>
<text x="526" y="194" text-anchor="middle" fill="var(--subtext)" font-size="8">Revoke all authority and</text>
<text x="526" y="206" text-anchor="middle" fill="var(--subtext)" font-size="8">contain downstream work</text>
<text x="526" y="218" text-anchor="middle" fill="var(--subtext)" font-size="8">Full containment</text>
<rect x="560" y="70" width="140" height="420" fill="var(--s4)" rx="6" stroke="var(--border)" stroke-width="1"/>
<text x="630" y="92" text-anchor="middle" fill="var(--on-primary)" font-size="13" font-weight="700">Stage 6</text>
<text x="630" y="108" text-anchor="middle" fill="var(--on-primary)" font-size="11">Shutdown</text>
<text x="630" y="124" text-anchor="middle" fill="var(--detail)" font-size="8">Terminate and transition to</text>
<text x="630" y="136" text-anchor="middle" fill="var(--detail)" font-size="8">fallback or earlier version</text>
<text x="630" y="148" text-anchor="middle" fill="var(--detail)" font-size="8">Most disruptive</text>
<line x1="60" y1="512" x2="640" y2="512" stroke="var(--muted)" stroke-width="1.5"/>
<polygon points="640,512 632,508 632,516" fill="var(--muted)"/>
<text x="350" y="525" text-anchor="middle" fill="var(--subtext)" font-size="9">Increasing platform maturity</text>
</svg>