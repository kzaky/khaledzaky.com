<text x="252" y="426" fill="var(--kz-text)" font-size="13.5" text-anchor="start">Provisioning</text>
<text x="236" y="446" fill="var(--kz-accent)" font-size="13.5" text-anchor="start" font-weight="700" font-family="Lora Variable, Lora, Georgia, serif">4</text>
<text x="252" y="446" fill="var(--kz-text)" font-size="13.5" text-anchor="start">Authentication</text>
