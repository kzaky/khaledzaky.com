<text x="40" y="498" fill="var(--kz-muted)" font-size="12.5" text-anchor="start">SPIFFE and SPIRE cover the Who row: workload identity and authentication.</text>
<text x="40" y="516" fill="var(--kz-muted)" font-size="12.5" text-anchor="start">Authorization is outside them by design.</text>
