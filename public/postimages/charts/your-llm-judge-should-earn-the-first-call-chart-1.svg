<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 482" font-family="Inter Variable, Inter, system-ui, -apple-system, sans-serif">
<style>
  :root {
    --bg: #ffffff; --card: #f9fafb; --border: #e5e7eb;
    --text: #111827; --subtext: #6b7280; --muted: #9ca3af;
    --c0: #0284c7; --c1: #d97706; --c2: #059669; --c3: #dc2626;
    --c4: #7c3aed; --c5: #db2777; --c6: #0891b2; --c7: #ea580c;
    --on-primary: white; --detail: #bfdbfe; --item-bg: #f0f9ff;
    --s1: #e0f2fe; --s2: #7dd3fc; --s3: #0ea5e9; --s4: #0369a1;
  }
  .dark svg {
    --bg: #030712; --card: #111827; --border: #1f2937;
    --text: #f9fafb; --subtext: #9ca3af; --muted: #6b7280;
    --c0: #38bdf8; --c1: #fbbf24; --c2: #34d399; --c3: #f87171;
    --c4: #a78bfa; --c5: #f472b6; --c6: #22d3ee; --c7: #fb923c;
    --on-primary: white; --detail: #7dd3fc; --item-bg: #0c4a6e;
    --s1: #082f49; --s2: #0c4a6e; --s3: #075985; --s4: #0369a1;
  }
</style>
<rect width="700" height="482" fill="var(--bg)"/>
<text x="30" y="24" text-anchor="start" fill="var(--text)" font-size="18" font-weight="700" font-family="Lora Variable, Lora, Georgia, serif">Phishing detection accuracy by method: Jev broad verdict 62.6%, Haiku 81.3%,</text>
<text x="30" y="46" text-anchor="start" fill="var(--text)" font-size="18" font-weight="700" font-family="Lora Variable, Lora, Georgia, serif">hosting-list rule 91.6%, Jev 5-signal+LR 95.0%</text>
<line x1="30" y1="58" x2="670" y2="58" stroke="var(--c0)" stroke-width="2" opacity="0.35"/>
<text x="206" y="103" text-anchor="end" fill="var(--subtext)" font-size="11">Jev broad verdict</text>
<rect x="220" y="74" width="257.0" height="48" fill="var(--c0)" rx="3"/>
<text x="488.9894736842105" y="105" fill="var(--text)" font-size="18" font-weight="800" font-family="Inter Variable, Inter, system-ui, -apple-system, sans-serif">62.6</text>
<text x="206" y="167" text-anchor="end" fill="var(--subtext)" font-size="11">Claude Haiku 4.5</text>
<rect x="220" y="138" width="333.8" height="48" fill="var(--c0)" rx="3"/>
<text x="565.7578947368421" y="169" fill="var(--text)" font-size="18" font-weight="800" font-family="Inter Variable, Inter, system-ui, -apple-system, sans-serif">81.3</text>
<text x="206" y="231" text-anchor="end" fill="var(--subtext)" font-size="11">Hosting-list rule</text>
<rect x="220" y="202" width="376.0" height="48" fill="var(--c0)" rx="3"/>
<text x="608.0421052631579" y="233" fill="var(--text)" font-size="18" font-weight="800" font-family="Inter Variable, Inter, system-ui, -apple-system, sans-serif">91.6</text>
<text x="206" y="287" text-anchor="end" fill="var(--subtext)" font-size="11">Jev 5-signal +</text>
<text x="206" y="302" text-anchor="end" fill="var(--subtext)" font-size="11">logistic regression</text>
<rect x="220" y="266" width="390.0" height="48" fill="var(--c0)" rx="3"/>
<text x="622.0" y="297" fill="var(--text)" font-size="18" font-weight="800" font-family="Inter Variable, Inter, system-ui, -apple-system, sans-serif">95</text>
<text x="206" y="351" text-anchor="end" fill="var(--subtext)" font-size="11">Haiku 5-signal +</text>
<text x="206" y="366" text-anchor="end" fill="var(--subtext)" font-size="11">logistic regression</text>
<rect x="220" y="330" width="382.6" height="48" fill="var(--c0)" rx="3"/>
<text x="614.6105263157895" y="361" fill="var(--text)" font-size="18" font-weight="800" font-family="Inter Variable, Inter, system-ui, -apple-system, sans-serif">93.2</text>
<text x="206" y="415" text-anchor="end" fill="var(--subtext)" font-size="11">Two non-AI</text>
<text x="206" y="430" text-anchor="end" fill="var(--subtext)" font-size="11">heuristic features</text>
<rect x="220" y="394" width="376.9" height="48" fill="var(--c0)" rx="3"/>
<text x="608.8631578947368" y="425" fill="var(--text)" font-size="18" font-weight="800" font-family="Inter Variable, Inter, system-ui, -apple-system, sans-serif">91.8</text>
</svg>