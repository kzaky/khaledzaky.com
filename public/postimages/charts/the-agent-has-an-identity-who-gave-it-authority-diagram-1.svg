<text x="24" y="34" fill="var(--kz-accent)" font-size="12.5" text-anchor="start" font-weight="600">Figure 1</text>
<text x="24" y="62" fill="var(--kz-text)" font-size="21" text-anchor="start" font-weight="700" font-family="Lora Variable, Lora, Georgia, serif">Three questions every agent action must answer</text>
<text x="24" y="84" fill="var(--kz-muted)" font-size="13" text-anchor="start">The travel analogy, mapped to the IETF AIMS functions and to where the market is</text>
