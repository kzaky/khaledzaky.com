<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 322" font-family="Inter Variable, Inter, system-ui, -apple-system, sans-serif">
<style>
  :root {
    --bg: #ffffff; --card: #f9fafb; --border: #e5e7eb;
    --text: #111827; --subtext: #6b7280; --muted: #9ca3af;
    --c0: #0284c7; --c1: #d97706; --c2: #059669; --c3: #dc2626;
    --c4: #7c3aed; --c5: #db2777; --c6: #0891b2; --c7: #ea580c;
    --on-primary: white; --detail: #bfdbfe; --item-bg: #f0f9ff;
    --s1: #e0f2fe; --s2: #7dd3fc; --s3: #0ea5e9; --s4: #0369a1;
  }
  .dark svg {
    --bg: #030712; --card: #111827; --border: #1f2937;
    --text: #f9fafb; --subtext: #9ca3af; --muted: #6b7280;
    --c0: #38bdf8; --c1: #fbbf24; --c2: #34d399; --c3: #f87171;
    --c4: #a78bfa; --c5: #f472b6; --c6: #22d3ee; --c7: #fb923c;
    --on-primary: white; --detail: #7dd3fc; --item-bg: #0c4a6e;
    --s1: #082f49; --s2: #0c4a6e; --s3: #075985; --s4: #0369a1;
  }
</style>
<rect width="700" height="322" fill="var(--bg)"/>
<text x="30" y="30" text-anchor="start" fill="var(--text)" font-size="20" font-weight="700" font-family="Lora Variable, Lora, Georgia, serif">Four questions a control must answer</text>
<line x1="30" y1="42" x2="670" y2="42" stroke="var(--c0)" stroke-width="2" opacity="0.35"/>
<rect x="30" y="68" width="170" height="52" fill="var(--item-bg)" rx="6" stroke="var(--border)" stroke-width="1"/>
<rect x="30" y="68" width="4" height="52" fill="var(--c0)" rx="2"/>
<text x="48" y="98" text-anchor="start" fill="var(--text)" font-size="13" font-weight="700">Coverage</text>
<rect x="208" y="68" width="462" height="52" fill="var(--card)" rx="6" stroke="var(--border)" stroke-width="1"/>
<text x="222" y="98" text-anchor="start" fill="var(--text)" font-size="12">Have you found the action paths?</text>
<rect x="30" y="128" width="170" height="52" fill="var(--item-bg)" rx="6" stroke="var(--border)" stroke-width="1"/>
<rect x="30" y="128" width="4" height="52" fill="var(--c0)" rx="2"/>
<text x="48" y="158" text-anchor="start" fill="var(--text)" font-size="13" font-weight="700">Binding</text>
<rect x="208" y="128" width="462" height="52" fill="var(--card)" rx="6" stroke="var(--border)" stroke-width="1"/>
<text x="222" y="158" text-anchor="start" fill="var(--text)" font-size="12">Does the control apply on those paths?</text>
<rect x="30" y="188" width="170" height="52" fill="var(--item-bg)" rx="6" stroke="var(--border)" stroke-width="1"/>
<rect x="30" y="188" width="4" height="52" fill="var(--c0)" rx="2"/>
<text x="48" y="218" text-anchor="start" fill="var(--text)" font-size="13" font-weight="700">Closure</text>
<rect x="208" y="188" width="462" height="52" fill="var(--card)" rx="6" stroke="var(--border)" stroke-width="1"/>
<text x="222" y="218" text-anchor="start" fill="var(--text)" font-size="12">Did the required action take effect?</text>
<rect x="30" y="248" width="170" height="52" fill="var(--item-bg)" rx="6" stroke="var(--border)" stroke-width="1"/>
<rect x="30" y="248" width="4" height="52" fill="var(--c0)" rx="2"/>
<text x="48" y="278" text-anchor="start" fill="var(--text)" font-size="13" font-weight="700">Qualification</text>
<rect x="208" y="248" width="462" height="52" fill="var(--card)" rx="6" stroke="var(--border)" stroke-width="1"/>
<text x="222" y="278" text-anchor="start" fill="var(--text)" font-size="12">Was the judgment fit for that action?</text>
</svg>