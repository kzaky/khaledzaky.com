<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 390" font-family="Inter Variable, Inter, system-ui, -apple-system, sans-serif">
<style>
  :root {
    --bg: #ffffff; --card: #f9fafb; --border: #e5e7eb;
    --text: #111827; --subtext: #6b7280; --muted: #9ca3af;
    --c0: #0284c7; --c1: #d97706; --c2: #059669; --c3: #dc2626;
    --c4: #7c3aed; --c5: #db2777; --c6: #0891b2; --c7: #ea580c;
    --on-primary: white; --detail: #bfdbfe; --item-bg: #f0f9ff;
    --s1: #e0f2fe; --s2: #7dd3fc; --s3: #0ea5e9; --s4: #0369a1;
  }
  .dark svg {
    --bg: #030712; --card: #111827; --border: #1f2937;
    --text: #f9fafb; --subtext: #9ca3af; --muted: #6b7280;
    --c0: #38bdf8; --c1: #fbbf24; --c2: #34d399; --c3: #f87171;
    --c4: #a78bfa; --c5: #f472b6; --c6: #22d3ee; --c7: #fb923c;
    --on-primary: white; --detail: #7dd3fc; --item-bg: #0c4a6e;
    --s1: #082f49; --s2: #0c4a6e; --s3: #075985; --s4: #0369a1;
  }
</style>
<rect width="700" height="390" fill="var(--bg)"/>
<text x="350" y="34" text-anchor="middle" fill="var(--text)" font-size="20" font-weight="700" font-family="Lora Variable, Lora, Georgia, serif">Evidence Scope by Change Type</text>
<line x1="30" y1="46" x2="670" y2="46" stroke="var(--c0)" stroke-width="2" opacity="0.35"/>
<rect x="30" y="258" width="145" height="92" fill="var(--s1)" rx="6" stroke="var(--border)" stroke-width="1"/>
<text x="102.5" y="280" text-anchor="middle" fill="var(--text)" font-size="13" font-weight="700">Stage 1</text>
<text x="102.5" y="296" text-anchor="middle" fill="var(--text)" font-size="11">No model-visible</text>
<text x="102.5" y="310" text-anchor="middle" fill="var(--text)" font-size="11">change</text>
<text x="102.5" y="326" text-anchor="middle" fill="var(--subtext)" font-size="8">Display text, log format</text>
<text x="102.5" y="338" text-anchor="middle" fill="var(--subtext)" font-size="8">Software tests only</text>
<rect x="195" y="192" width="145" height="158" fill="var(--s2)" rx="6" stroke="var(--border)" stroke-width="1"/>
<text x="267.5" y="214" text-anchor="middle" fill="var(--text)" font-size="13" font-weight="700">Stage 2</text>
<text x="267.5" y="230" text-anchor="middle" fill="var(--text)" font-size="11">Model inputs change</text>
<text x="267.5" y="246" text-anchor="middle" fill="var(--subtext)" font-size="8">Instructions, option</text>
<text x="267.5" y="258" text-anchor="middle" fill="var(--subtext)" font-size="8">wording, context,</text>
<text x="267.5" y="270" text-anchor="middle" fill="var(--subtext)" font-size="8">truncation</text>
<text x="267.5" y="282" text-anchor="middle" fill="var(--subtext)" font-size="8">Rerun behavioral tests</text>
<rect x="360" y="126" width="145" height="224" fill="var(--s3)" rx="6" stroke="var(--border)" stroke-width="1"/>
<text x="432.5" y="148" text-anchor="middle" fill="var(--text)" font-size="13" font-weight="700">Stage 3</text>
<text x="432.5" y="164" text-anchor="middle" fill="var(--text)" font-size="11">Output interpretation</text>
<text x="432.5" y="178" text-anchor="middle" fill="var(--text)" font-size="11">changes</text>
<text x="432.5" y="194" text-anchor="middle" fill="var(--text)" font-size="8">Thresholds, probability</text>
<text x="432.5" y="206" text-anchor="middle" fill="var(--text)" font-size="8">math, action policy</text>
<text x="432.5" y="218" text-anchor="middle" fill="var(--text)" font-size="8">Replay logged outputs and</text>
<text x="432.5" y="230" text-anchor="middle" fill="var(--text)" font-size="8">review threshold crossings</text>
<rect x="525" y="60" width="145" height="290" fill="var(--s4)" rx="6" stroke="var(--border)" stroke-width="1"/>
<text x="597.5" y="82" text-anchor="middle" fill="var(--on-primary)" font-size="13" font-weight="700">Stage 4</text>
<text x="597.5" y="98" text-anchor="middle" fill="var(--on-primary)" font-size="11">Outputs or scope</text>
<text x="597.5" y="112" text-anchor="middle" fill="var(--on-primary)" font-size="11">change</text>
<text x="597.5" y="128" text-anchor="middle" fill="var(--detail)" font-size="8">Model swap, new labels, new</text>
<text x="597.5" y="140" text-anchor="middle" fill="var(--detail)" font-size="8">population</text>
<text x="597.5" y="152" text-anchor="middle" fill="var(--detail)" font-size="8">Full requalification</text>
<text x="597.5" y="164" text-anchor="middle" fill="var(--detail)" font-size="8">against acceptance criteria</text>
<line x1="60" y1="372" x2="640" y2="372" stroke="var(--muted)" stroke-width="1.5"/>
<polygon points="640,372 632,368 632,376" fill="var(--muted)"/>
<text x="350" y="385" text-anchor="middle" fill="var(--subtext)" font-size="9">Increasing platform maturity</text>
</svg>